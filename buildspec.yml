version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo Installing dependencies...
      - cd customer-support-bot && npm ci --legacy-peer-deps

  build:
    commands:
      - echo Starting server validation...
      - cd customer-support-bot && node -e "require('./server.js')" --check 2>/dev/null || true

  post_build:
    commands:
      - echo Build complete. Artifacts ready for deployment.

artifacts:
  files:
    - '**/*'
  base-directory: customer-support-bot
  discard-paths: no

  # secondary-artifacts can be used to push only the static frontend to S3
  # if you want index.html at the S3 bucket root, use base-directory below:
  # base-directory: customer-support-bot/public
