version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo Installing dependencies...
      - cd customer-support-bot && npm ci --legacy-peer-deps

  build:
    commands:
      - echo Verifying public assets...
      - ls -la customer-support-bot/public/ && echo "Found at customer-support-bot/public/" || (ls -la public/ && echo "Found at public/") || echo "WARNING: public/ not found in either path"
      - find . -name "index.html" 2>/dev/null || echo "index.html not found anywhere"

  post_build:
    commands:
      - echo Build complete. Artifacts ready for deployment.

artifacts:
  files:
    - 'server.js'
    - 'package.json'
    - 'package-lock.json'
    - 'public/**/*'
    - 'node_modules/**/*'
  base-directory: customer-support-bot
  discard-paths: no
