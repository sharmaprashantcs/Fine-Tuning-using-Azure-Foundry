version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo Installing dependencies...
      - cd customer-support-bot && npm ci --legacy-peer-deps

  build:
    commands:
      - echo Verifying public assets...
      - find . -name "index.html" 2>/dev/null && echo "index.html found" || echo "index.html NOT found"
      - ls -la customer-support-bot/public/ 2>/dev/null || ls -la public/ 2>/dev/null || echo "public dir not found"

  post_build:
    commands:
      - echo Build complete. Artifacts ready for deployment.

artifacts:
  files:
    - 'server.js'
    - 'package.json'
    - 'package-lock.json'
    - 'public/**/*'
    - 'node_modules/**/*'
  base-directory: customer-support-bot
  discard-paths: no
